<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080609">
  <title>Becky 🖤</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: #080609;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 18px;
      position: relative;
      overflow-x: hidden;
    }

    /* Blurred Becky background */
    body::before {
      content: "";
      position: fixed;
      inset: -40px;

      background:
        linear-gradient(
          rgba(7, 4, 9, 0.72),
          rgba(7, 4, 9, 0.90)
        ),
        url("becky-profile.png") center / cover no-repeat;

      filter: blur(25px);
      transform: scale(1.10);
      z-index: -2;
    }

    /* Purple atmosphere */
    body::after {
      content: "";
      position: fixed;
      inset: 0;

      background:
        radial-gradient(
          circle at 50% 18%,
          rgba(172, 72, 200, 0.25),
          transparent 42%
        ),
        linear-gradient(
          to bottom,
          rgba(0,0,0,0.05),
          rgba(0,0,0,0.25)
        );

      z-index: -1;
      pointer-events: none;
    }

    .card {
      width: 100%;
      max-width: 420px;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    /* Becky profile image */
    .avatar {
      width: 112px;
      height: 112px;
      border-radius: 50%;
      margin: 0 auto 18px;
      border: 2px solid #b05bc4;
      overflow: hidden;

      box-shadow:
        0 0 0 4px rgba(176, 91, 196, 0.10),
        0 0 32px rgba(176, 91, 196, 0.42);
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    h1 {
      font-size: 30px;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    .handle {
      color: rgba(255,255,255,0.65);
      font-size: 14px;
      margin-bottom: 25px;
    }

    .headline {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .subtext {
      color: rgba(255,255,255,0.76);
      line-height: 1.5;
      font-size: 16px;
      margin: 0 auto 30px;
      max-width: 330px;
    }

    /* Glass age gate */
    .age-box {
      background: rgba(15, 11, 17, 0.66);
      border: 1px solid rgba(255,255,255,0.13);
      border-radius: 20px;
      padding: 22px 18px;

      box-shadow:
        0 18px 55px rgba(0,0,0,0.35),
        inset 0 1px 0 rgba(255,255,255,0.04);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .age-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 7px;
    }

    .age-copy {
      color: rgba(255,255,255,0.65);
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 18px;
    }

    button,
    .fanvue-button {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 16px;
      font-family: inherit;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .continue,
    .fanvue-button {
      background: #fff;
      color: #080808;

      box-shadow:
        0 6px 22px rgba(0,0,0,0.20);
    }

    .continue {
      margin-bottom: 10px;
    }

    .continue:active,
    .fanvue-button:active {
      transform: scale(0.985);
    }

    .leave {
      background: transparent;
      color: rgba(255,255,255,0.48);
    }

    #destination {
      display: none;
    }

    .fanvue-button {
      display: block;
      text-decoration: none;
      margin-top: 18px;
    }

    .small {
      margin-top: 18px;
      color: rgba(255,255,255,0.40);
      font-size: 12px;
    }

    @media (max-width: 480px) {
      body {
        padding: 28px 16px;
      }

      .avatar {
        width: 104px;
        height: 104px;
      }

      h1 {
        font-size: 28px;
      }

      .headline {
        font-size: 21px;
      }

      .age-box {
        border-radius: 18px;
        padding: 20px 16px;
      }
    }
  </style>
</head>

<body>

  <main class="card">

    <div class="avatar">
      <img src="becky-profile.png" alt="Becky">
    </div>

    <h1>BECKY 🖤</h1>

    <div class="handle">
      @snowbeckyy
    </div>

    <div class="headline">
      you actually found it lol
    </div>

    <div class="subtext">
      the side of me i don't really post on ig 🙃
    </div>

    <section id="ageGate" class="age-box">

      <div class="age-title">
        18+ only
      </div>

      <div class="age-copy">
        This page links to content intended for adults.
        Please confirm that you are 18 or older.
      </div>

      <button class="continue" onclick="confirmAge()">
        i'm 18+ — continue
      </button>

      <button class="leave" onclick="leavePage()">
        go back
      </button>

    </section>

    <section id="destination" class="age-box">

      <div class="age-title">
        okayyy hi 🖤
      </div>

      <div class="age-copy">
        you made it this far... might as well come say hi 🙃
      </div>

      <a
        class="fanvue-button"
        href="https://www.fanvue.com/snow-beckkkyy-738"
        rel="noopener noreferrer"
      >
        more of me + come talk 🖤
      </a>

      <div class="small">
        18+ only
      </div>

    </section>

  </main>

  <script>
    function confirmAge() {
      document.getElementById("ageGate").style.display = "none";
      document.getElementById("destination").style.display = "block";
    }

    function leavePage() {
      if (document.referrer) {
        history.back();
      } else {
        window.location.href = "https://www.instagram.com/snowbeckyy/";
      }
    }
  </script>

</body>
</html>
